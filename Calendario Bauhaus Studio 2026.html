<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario Bauhaus Studio 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:'Montserrat',Arial,sans-serif}
#bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:#000;border-bottom:1px solid #333;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
#bar select{-webkit-appearance:none;appearance:none;min-width:150px;text-align:center;text-align-last:center}#bar button,#bar select{background:#000;color:#fff;border:1px solid #fff;padding:8px 14px;font:500 12px 'Montserrat',Arial;letter-spacing:.12em;border-radius:0}
#wrap{overflow-x:auto;overflow-y:hidden}#sizer{position:relative}#stage{position:absolute;left:0;top:0}#zl{font-size:12px;letter-spacing:.1em;align-self:center;min-width:42px;text-align:center}#bar button{touch-action:manipulation}#pal{display:flex;gap:8px;align-items:center}#bar #pal button{width:28px;height:28px;padding:0;border-radius:50%;border:1px solid #666}
#stage{width:1536px;height:1024px;padding:30px 22px 20px;display:flex;flex-direction:column;transform-origin:0 0;background:#000}
#head{height:112px;display:flex;align-items:center;justify-content:space-between}
.lg{display:flex;align-items:center;gap:28px;padding-left:18px}
.lg .a{text-align:center}.lg .a img{width:222px;display:block}.lg .a small{display:block;font-size:9px;letter-spacing:.3em;margin-top:6px}
.lg .b img{width:282px;display:block}
.sep{width:1px;height:86px;background:rgba(255,255,255,.7)}
.mt{display:flex;align-items:center;gap:26px}
#mname{font:400 88px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:-.01em}
#yr{font:400 54px/1 'Cormorant Garamond',Georgia,serif;color:#9a9a9a;margin-left:-8px}
.tag{font-size:9px;letter-spacing:.3em;line-height:1.55;border-left:1px solid rgba(255,255,255,.7);padding-left:20px;height:86px;display:flex;align-items:center;text-transform:uppercase}
#dows{display:grid;grid-template-columns:repeat(7,1fr);height:36px;margin-top:6px}
#dows div{display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.3em;border-left:1px solid rgba(255,255,255,.7)}
#dows div:first-child{border-left:0}
#grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #ddd;border-left:1px solid #ddd;min-height:0}
.c{position:relative;border-right:1px solid #ddd;border-bottom:1px solid #ddd;min-height:0}
.c .d{position:absolute;left:12px;top:6px;font:400 40px/1 'Cormorant Garamond',Georgia,serif}
.ck{z-index:2;position:absolute;right:10px;top:12px;display:flex;flex-direction:column;gap:5px}
.ck div{padding:3px 8px 3px 4px;margin:-3px -8px -3px -4px;touch-action:manipulation;display:flex;align-items:center;gap:6px;font-size:8.5px;letter-spacing:.2em;cursor:pointer;text-transform:uppercase;user-select:none}
.bx{width:11px;height:11px;border:1px solid #fff;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;line-height:1;font-weight:500}
.tx{outline:0;color:#fff;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}.c .tx{position:absolute;left:8px;right:8px;top:56px;bottom:5px;overflow:auto;font:400 12.5px/1.3 'Montserrat',Arial;scrollbar-width:none}
.c.off{border-color:transparent}
#foot{height:178px;display:grid;grid-template-columns:1.05fr .8fr .8fr .5fr;margin-top:34px}
#foot section{padding:0 34px;border-left:1px solid rgba(255,255,255,.7)}
#foot section:first-child{border:0;padding-left:34px}
#foot h4{margin:2px 0 14px;font:500 11px 'Montserrat',Arial;letter-spacing:.3em;text-transform:uppercase}
#foot .nt{width:100%;height:100px;margin-top:2px;overflow-y:auto;font:400 13px/25px 'Montserrat',Arial;background:repeating-linear-gradient(to bottom,transparent 0 24px,rgba(255,255,255,.85) 24px 25px);background-attachment:local;scrollbar-width:none}
.ln{display:flex;align-items:center;gap:12px;height:24px;margin-bottom:0}
.ln .bx{width:14px;height:14px;font-size:12px;flex:none;cursor:pointer}
.ln .tx{flex:1;min-width:0;border-bottom:1px solid rgba(255,255,255,.85);font:400 13px/20px 'Montserrat',Arial;height:22px;white-space:nowrap;overflow:hidden;padding:0}.ln .bx{position:relative}.ln .bx::after{content:'';position:absolute;inset:-7px}
.ln{margin-bottom:6px}
@media print{
 @page{size:1536px 1024px;margin:0}
 :root{padding:0}
 #bar{display:none}#wrap{overflow:visible!important}#sizer{width:1536px!important;height:1024px!important}#stage{position:static!important}
 #stage{transform:none!important}
 body,#stage{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>

 <button id="fs" title="Pantalla completa">PANTALLA COMPLETA</button>
</div>

(async()=>{try{if(window.claude&&claude.use){db=await claude.use('db');if(db){setSy('☁ Conectando…');sub()}}}catch(e){db=null}})();
const cell=d=>S.c[d]||(S.c[d]={k:[0,0,0]});
const H=o=>!o?'':o.h!=null?o.h:(o.t?`<span style="color:${o.col||'#fff'}">${esc(o.t)}</span>`:'');
function render(){load();draw();sub()}
function draw(){
$('mname').textContent=MS[m];$('msel').value=mi;$('yr').textContent=Y;
 const first=(new Date(Y,m,1).getDay()+6)%7,n=new Date(Y,m+1,0).getDate(),rows=Math.ceil((first+n)/7);
 let h='';
 for(let i=0;i<rows*7;i++){const d=i-first+1;
  if(d<1||d>n){h+='<div class="c off"></div>';continue}
  const c=S.c[d]||{k:[0,0,0]};
  h+=`<div class="c" data-d="${d}"><span class="d">${d}</span><div class="ck">${LB.map((l,j)=>`<div data-j="${j}"><span class="bx">${G[c.k[j]]}</span>${l}</div>`).join('')}</div><div class="tx" contenteditable="true" spellcheck="false">${H(c)}</div></div>`}
 $('grid').innerHTML=h;$('grid').style.gridTemplateRows=`repeat(${rows},1fr)`;
 for(const k of ['pr','pj','mt']){
  $(k).innerHTML=[0,1,2,3].map(i=>{const v=S.l[k][i]||{s:0};return `<div class="ln" data-k="${k}" data-i="${i}"><span class="bx">${G[v.s||0]}</span><div class="tx" contenteditable="true" spellcheck="false">${H(v)}</div></div>`}).join('')}
 $('nt').innerHTML=S.nh!=null?S.nh:H({t:S.n,col:S.nc});
}
document.addEventListener('click',e=>{
 const j=e.target.closest('.ck div');
 if(j){const d=j.closest('.c').dataset.d,c=cell(d),i=+j.dataset.j;c.k[i]=(c.k[i]+1)%3;save();j.firstChild.textContent=G[c.k[i]];return}
 const b=e.target.closest('.ln .bx');
 if(b){const l=b.parentNode,a=S.l[l.dataset.k],i=+l.dataset.i;a[i]=a[i]||{s:0};a[i].s=((a[i].s||0)+1)%3;save();b.textContent=G[a[i].s]}
});
document.addEventListener('input',e=>{
 const t=e.target.closest('.tx');if(!t)return;
 let h=t.innerHTML;if(!t.textContent)h='';
 const c=t.closest('.c'),l=t.closest('.ln');
 if(c)cell(c.dataset.d).h=h;
 else if(l){const a=S.l[l.dataset.k],i=+l.dataset.i;a[i]=a[i]||{s:0};a[i].h=h}
 else S.nh=h;
 save()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.ln .tx'))e.preventDefault()});
document.addEventListener('paste',e=>{const t=e.target.closest('.tx');if(!t)return;e.preventDefault();
 let s=(e.clipboardData||window.clipboardData).getData('text/plain');if(t.closest('.ln'))s=s.replace(/\s*\n\s*/g,' ');
 document.execCommand('insertText',false,s)});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('.tx');if(!t)return;
 document.execCommand('styleWithCSS',false,true);
 if(cur!=='#ffffff'&&!t.textContent)document.execCommand('foreColor',false,cur)});
const pal=$('pal');['mousedown','pointerdown','touchstart'].forEach(ev=>pal.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
pal.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.c;
 document.querySelectorAll('#pal button').forEach(x=>x.style.outline=x===b?'2px solid #fff':'none');
 const a=document.activeElement;
 if(a&&a.classList&&a.classList.contains('tx')){document.execCommand('styleWithCSS',false,true);document.execCommand('foreColor',false,cur);a.dispatchEvent(new Event('input',{bubbles:true}))}});
$('msel').innerHTML=Array.from({length:15},(_,i)=>{const x=MS[(9+i)%12];return `<option value="${i}">${x[0]+x.slice(1).toLowerCase()} ${2026+Math.floor((9+i)/12)}</option>`}).join('');
$('msel').onchange=e=>{setM(+e.target.value);render()};
$('prev').onclick=()=>{setM((mi+14)%15);render()};$('next').onclick=()=>{setM((mi+1)%15);render()};
$('clr').onclick=()=>{if(confirm('¿Borrar todo lo escrito en este mes?')){S={c:{},l:{pr:[],pj:[],mt:[]}};save();draw()}};
$('pdf').onclick=()=>window.print();
$('zi').onclick=()=>{z=Math.min(3,+(z+.25).toFixed(2));fit()};$('zo').onclick=()=>{z=Math.max(1,+(z-.25).toFixed(2));fit()};
$('dows').innerHTML=DW.map(x=>`<div>${x}</div>`).join('');
function fit(){let w=Math.max(innerWidth||0,document.documentElement.clientWidth||0);if(w<200){setTimeout(fit,250);w=390}const s=Math.min(1,w/1536)*z;$('stage').style.transform=`scale(${s})`;$('sizer').style.width=1536*s+'px';$('sizer').style.height=1024*s+'px';$('zl').textContent=Math.round(z*100)+'%'}
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());for(const i in o){const mm=(9+ +i)%12,yy=2026+Math.floor((9+ +i)/12),p=yy==2026?'26':'27',j=JSON.stringify(o[i]);try{localStorage.setItem('bsc'+p+':'+mm,j)}catch(_){}if(db){try{await db.doc('cal/m'+p+'_'+mm).set({s:j})}catch(_){}}}setSy('Datos importados');render()}catch(err){alert('No se pudo leer el archivo')}e.target.value=''};
let dl=null;(async()=>{try{if(window.claude&&claude.use){dl=await claude.use('downloads');if(dl)$('exp').style.display=''}}catch(e){}})();
$('exp').onclick=async()=>{const out={};for(let i=0;i<15;i++){const mm=(9+i)%12,yy=2026+Math.floor((9+i)/12),p=yy==2026?'26':'27';let v=null;
 if(db){try{const s=await db.doc('cal/m'+p+'_'+mm).get();if(s.exists)v=(s.data()||{}).s}catch(e){}}
 if(!v){try{v=localStorage.getItem('bsc'+p+':'+mm)}catch(e){}}
 if(v){try{out[i]=JSON.parse(v)}catch(e){}}}
 try{await dl.save({filename:'calendario-datos.json',data:JSON.stringify(out)});setSy('Archivo listo')}catch(e){}};
addEventListener('resize',fit);addEventListener('load',fit);addEventListener('orientationchange',fit);if(window.ResizeObserver)try{new ResizeObserver(fit).observe(document.documentElement)}catch(e){}fit();render();setTimeout(fit,400);
</script>
<script>(function(){var b=document.getElementById('fs'),d=document,e=d.documentElement;
var req=e.requestFullscreen||e.webkitRequestFullscreen,ex=d.exitFullscreen||d.webkitExitFullscreen;
if(!b)return;if(!req){b.style.display='none';return}
function on(){return !!(d.fullscreenElement||d.webkitFullscreenElement)}
function lab(){b.textContent=on()?'SALIR DE PANTALLA COMPLETA':'PANTALLA COMPLETA';setTimeout(function(){window.dispatchEvent(new Event('resize'))},150)}
function fail(){b.textContent='NO DISPONIBLE AQUÍ';setTimeout(lab,2000)}
b.addEventListener('click',function(){try{var r=on()?ex.call(d):req.call(e);if(r&&r.catch)r.catch(fail)}catch(x){fail()}});
d.addEventListener('fullscreenchange',lab);d.addEventListener('webkitfullscreenchange',lab);
d.addEventListener('keydown',function(ev){if((ev.key==='f'||ev.key==='F')&&!/INPUT|SELECT|TEXTAREA/.test((ev.target.tagName||'')))b.click()});
})();</script></body></html>
